<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MF.Yuksak Travel</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MF.Yuksak">
<style>
:root{color-scheme:light;--b:#0d4f8b;--g:#1a9b55;--gold:#c9a24a;--k:#0b0b0b;--ink:#1b2a33;--mut:#68767e;--line:#e5e9ec;box-sizing:border-box}
*{box-sizing:border-box}
body{margin:0;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#0b0b0b,#1a1a1a 60%,#2a2416);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.shell{max-width:980px;margin:0 auto;background:#fff;border:2px solid var(--gold);border-radius:8px;min-height:90vh;box-shadow:0 0 0 4px var(--k)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
header img{width:52px;height:52px;border-radius:50%}
header b{font:700 19px Georgia,serif;color:var(--b)}header small{display:block;color:var(--g);letter-spacing:.2em;font-size:11px}
nav{display:flex;overflow-x:auto;position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:3}
nav button{flex:none;padding:12px 15px;border:0;background:none;font:600 14px system-ui;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--b);border-color:var(--gold)}
main{padding:14px 16px 40px}
h2{font:700 20px Georgia,serif;margin:4px 0 12px;color:var(--b)}h3{margin:0 0 10px}
.kaaba{background:linear-gradient(160deg,#0b0b0b,#1a1a1a 60%,#2a2416);border:2px solid var(--gold);border-radius:10px;padding:12px;color:#f3e7c5;margin-bottom:16px}
.kaaba h2{color:var(--gold);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{background:rgba(0,0,0,.82);border:1px solid #5b4a22;border-radius:8px;padding:10px}
.tile span{font-size:12px;color:#cdbb8a}.tile b{display:block;font:700 19px Georgia,serif;color:var(--gold)}.tile small{color:#e8dcb8;font-size:12px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.row b{font-weight:600}.row small,.card small{display:block;color:var(--mut);font-size:12px}
.mut{color:var(--mut);font-size:13px}.bad b{color:#b3382a}.ok b{color:var(--g)}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;margin-left:4px}.tag.g{background:var(--g)}.tag.b{background:var(--b)}
a{color:var(--b)}
button{font:600 14px system-ui;cursor:pointer}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.acts button,.top button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.acts .del{color:#b3382a}.top{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.pri,.top .pri{background:var(--b);color:#fff;border:0;padding:10px 16px;border-radius:8px;text-decoration:none;display:inline-block}
.ava{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--line)}
.who{display:flex;gap:12px;align-items:center}
input,select,textarea{width:100%;padding:10px;border:1px solid #cfd6da;border-radius:8px;font:16px system-ui;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}label.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}label.ck input{width:auto}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:12px}.sheet.show{display:flex}
.sheet form{background:#fff;width:100%;max-width:460px;max-height:92%;overflow:auto;padding:16px;border-radius:12px;border:2px solid var(--gold)}
.btns{display:flex;gap:8px;margin-top:14px}.btns button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:#fff}.btns .pri{background:var(--b);color:#fff;border:0}
.empty{text-align:center;color:var(--mut);padding:26px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.ph{display:none}
@media print{body{background:#fff;padding:0}.shell{border:0;box-shadow:none}nav,.top,.noprint,header{display:none}.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}.ph img{width:48px}@page{size:A4;margin:14mm}}

.shell{padding-bottom:78px}
nav{position:fixed;top:auto;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,980px);border:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 20px rgba(0,0,0,.12);z-index:8}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:11px;border:0}
nav button svg{width:24px;height:24px}nav button.on{color:var(--b);box-shadow:inset 0 3px 0 var(--gold)}
.panels{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.pn{border-radius:16px;padding:14px;color:#fff;min-height:104px;box-shadow:0 8px 18px rgba(0,0,0,.15)}
.pn span{font-size:12px;opacity:.88}.pn b{display:block;font:700 21px system-ui;margin-top:4px;letter-spacing:-.4px}.pn small{color:rgba(255,255,255,.82);font-size:12px}
.p1{background:linear-gradient(135deg,#0d4f8b,#2287e0)}.p2{background:linear-gradient(135deg,#0f7a4a,#2bc47a)}.p3{background:linear-gradient(135deg,#8a6a1f,#e8bb55)}.p4{background:linear-gradient(135deg,#b3382a,#f2705a)}.p5{background:linear-gradient(135deg,#3b2a7a,#8260e0)}.p6{background:linear-gradient(135deg,#111,#3d3d3d)}
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.ic{background:linear-gradient(160deg,#121212,#2b2416);border:1px solid #7a6630;border-radius:16px;padding:14px 4px;color:#f3e7c5;display:flex;flex-direction:column;align-items:center;gap:7px;font:600 12px system-ui;text-align:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 16px rgba(0,0,0,.2)}
.ic svg{width:36px;height:36px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1a9b55,#2bc47a)}
.st{font-size:11px;padding:2px 9px;border-radius:10px;color:#fff;margin-left:4px}.st.a{background:#d98a1f}.st.f{background:var(--g)}.st.n{background:#b3382a}

h2{font:700 18px/1.2 system-ui;color:var(--ink);border-left:4px solid var(--gold);padding-left:10px;margin:18px 0 12px}
header b{font:800 20px system-ui;letter-spacing:.3px}
.card{border-radius:14px;box-shadow:0 2px 10px rgba(13,79,139,.07)}
.row b{font-size:16px;font-weight:700}
.pl{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}.pl span{color:var(--mut)}.pl b{font-size:14px;text-align:right}
.seg{display:flex;background:#eef1f3;border-radius:12px;padding:4px;margin-bottom:10px}.seg button{flex:1;padding:9px;border:0;border-radius:9px;background:none;color:var(--mut)}.seg .on{background:#fff;color:var(--b);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.rads{display:grid;gap:8px}label.rd{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #cfd6da;border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink);margin:0}label.rd input{width:22px;height:22px}label.rd:has(input:checked){border-color:var(--g);background:#eefaf3}
.pn{-webkit-print-color-adjust:exact;print-color-adjust:exact}

.icons{grid-template-columns:repeat(4,1fr);gap:8px}.ic{padding:12px 2px;font-size:11px;gap:5px}.ic svg{width:30px;height:30px}
nav button{font-size:10px;padding:8px 0}nav button svg{width:22px;height:22px}
.panels .full{grid-column:1/-1}.pn b+b{margin-top:2px}
.bl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.bl .chip{text-decoration:none;color:var(--b);padding:5px 10px}
.chipb{padding:13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:600 15px system-ui;color:var(--ink)}
</style>
</head>
